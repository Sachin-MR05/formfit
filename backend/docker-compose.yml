# PostgreSQL + the API:   FORMFIT_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(48))") docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: formfit
      POSTGRES_PASSWORD: formfit
      POSTGRES_DB: formfit
    volumes:
      - formfit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formfit"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORMFIT_ENV: ${FORMFIT_ENV:-development}
      FORMFIT_SECRET_KEY: ${FORMFIT_SECRET_KEY:?set FORMFIT_SECRET_KEY (see the comment at the top of this file)}
      FORMFIT_DATABASE_URL: postgresql://formfit:formfit@db:5432/formfit
      FORMFIT_CORS_ORIGINS: ${FORMFIT_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"

volumes:
  formfit-pg:
